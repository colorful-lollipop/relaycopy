name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest tests.test_unit -v
      - run: python scripts/build.py
      - run: python dist/relaycp.pyz --version
  ssh-integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y openssh-server rsync
      - run: sudo mkdir -p /run/sshd
      - run: RELAYCP_INTEGRATION=1 python -m unittest tests.test_integration -v
